name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Unpinned on purpose: validation rules track the runtime, so we want to
      # hear about a break when it lands, not after users do.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Two calls: pointed at a directory, validate resolves marketplace.json
      # and stops, so plugin.json needs naming explicitly. --strict fails on
      # unknown fields and missing skill paths, which the runtime only warns on.
      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      # `claude plugin validate` accepts frontmatter that a strict YAML parser
      # rejects. The Skills CLI uses a strict one, so a skill can install fine
      # on Claude Code and be skipped everywhere else. Parse it the strict way
      # here, and hold the 1024-char budget while we are at it.
      - name: Check skill frontmatter
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml

          LIMIT = 1024
          failed = False
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text()
              if not text.startswith("---\n"):
                  print(f"FAIL {skill}: no YAML frontmatter")
                  failed = True
                  continue
              body = text.split("---\n", 2)[1]

              try:
                  meta = yaml.safe_load(body)
              except yaml.YAMLError as exc:
                  print(f"FAIL {skill}: frontmatter is not strict YAML -- {exc}")
                  failed = True
                  continue
              if not isinstance(meta, dict):
                  print(f"FAIL {skill}: frontmatter is not a mapping")
                  failed = True
                  continue
              for field in ("name", "description"):
                  if not meta.get(field):
                      print(f"FAIL {skill}: missing required field '{field}'")
                      failed = True

              size = len(body)
              if size > LIMIT:
                  print(f"FAIL {skill}: {size}/{LIMIT} frontmatter chars")
                  failed = True
              else:
                  print(f"ok   {skill}: strict YAML, {size}/{LIMIT} frontmatter chars")
          sys.exit(1 if failed else 0)
          PY
