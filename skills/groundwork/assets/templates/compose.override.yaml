# DEV — auto-loaded by `docker compose up`
# Ports bind to 127.0.0.1: reachable from this machine only, not from the network you're on.
services:
  api:
    build: {target: dev}
    volumes: ["./:/app"]
    ports: ["127.0.0.1:8001:8000"]
    environment: {APP_ENV: dev, LOG_LEVEL: DEBUG}
  worker:
    build: {target: dev}
    volumes: ["./:/app"]
  db:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  qdrant:
    ports: ["127.0.0.1:6333:6333"]
  prometheus:
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    ports: ["127.0.0.1:3001:3000"]
